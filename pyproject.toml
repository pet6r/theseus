[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "theseus"
version = "0.1.0"
description = "AI-assisted reverse engineering pipeline. Navigate any binary."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "leal" }]
dependencies = [
    "anthropic>=0.39.0",
    "claude-agent-sdk>=0.1.0",
    "dearpygui>=2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.4",
    "rich>=13.7.0",
    "typer>=0.12.0",
]

[project.scripts]
theseus = "theseus.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
